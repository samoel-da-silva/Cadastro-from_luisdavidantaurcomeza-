<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro - Dark Theme</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0a0a; /* Fundo Preto Profundo */
            color: #e0e0e0; /* Texto Claro */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .form-container {
            background-color: #121212; /* Fundo do Formulário Escuro */
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(211, 47, 47, 0.4); /* Neon Red Glow */
            width: 100%;
            max-width: 550px;
            border: 1px solid #d32f2f; /* Borda Vermelha */
        }

        h2 {
            text-align: center;
            color: #d32f2f; /* Título Vermelho */
            margin-bottom: 30px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            color: #e0e0e0;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            background-color: #1a1a1a; /* Fundo do Input Escuro */
            color: #e0e0e0; /* Texto do Input Claro */
            border: 1px solid #333; /* Borda Sutil */
            border-radius: 6px;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #d32f2f; /* Foco Vermelho */
            box-shadow: 0 0 8px rgba(211, 47, 47, 0.3);
        }

        input[type="text"]::placeholder {
            color: #777; /* Placeholder Escuro */
        }

        .checkbox-group label {
            font-weight: normal;
            display: inline-flex;
            align-items: center;
            margin-right: 18px;
            cursor: pointer;
            color: #e0e0e0;
            margin-bottom: 8px;
        }

        .checkbox-group input[type="checkbox"] {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid #555;
            border-radius: 4px;
            background-color: #1a1a1a;
            margin-right: 8px;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
        }

        .checkbox-group input[type="checkbox"]:checked {
            background-color: #406080; /* Fundo Azul Sutil quando selecionado */
            border-color: #406080;
        }

        .checkbox-group input[type="checkbox"]:checked::after {
            content: '\2714'; /* Checkmark symbol */
            font-size: 14px;
            color: #d32f2f; /* Checkmark Vermelho */
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Oculta a caixa de observação por padrão */
        #caixa-observacao {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background-color: #1a1a1a;
            border-radius: 8px;
            border: 1px solid #333;
        }

        #caixa-observacao label {
            color: #d32f2f; /* Label Vermelho para Observação */
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: #406080; /* Fundo Azul Sutil (menos perceptível) */
            color: #d32f2f; /* Texto Vermelho Vibrante */
            border: 1px solid #d32f2f; /* Borda Vermelha */
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        button:hover {
            background-color: #d32f2f; /* Inverte no Hover: Fundo Vermelho */
            color: #fff; /* Texto Branco */
            box-shadow: 0 6px 12px rgba(211, 47, 47, 0.5);
        }

        @media (max-width: 600px) {
            .form-container {
                padding: 20px;
            }
            .checkbox-group label {
                margin-right: 10px;
            }
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Novo Cadastro</h2>
    <form action="/cadastrar" method="POST">
        
        <div class="form-group">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
        </div>

        <div class="form-group">
            <label for="telefone">Número de Telefone</label>
            <input type="text" id="telefone" name="telefone" maxlength="11" placeholder="Ex: 41987859370 (Formatado (41) 98785-9370)" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
        </div>

        <div class="form-group">
            <label for="documento">CPF ou RG</label>
            <input type="text" id="documento" name="documento" maxlength="11" placeholder="9 dígitos (RG: 00.000.000-0) ou 11 dígitos (CPF: 000.000.000-00)" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
        </div>

        <div class="form-group checkbox-group">
            <label><strong>Selecione o Vínculo:</strong></label><br>
            <label><input type="checkbox" class="cb-vinculo" name="vinculo" value="Aluno"> Aluno</label>
            <label><input type="checkbox" class="cb-vinculo" name="vinculo" value="Pai/Mãe"> Pai/Mãe</label>
            <label><input type="checkbox" class="cb-vinculo" name="vinculo" value="Responsavel"> Responsável</label>
            <label><input type="checkbox" class="cb-vinculo" name="vinculo" value="Autoridade"> Autoridade</label>
        </div>

        <div class="form-group" id="caixa-observacao">
            <label id="label-observacao" for="observacao">Observação</label>
            <input type="text" id="observacao" name="observacao">
        </div>

        <button type="submit">Enviar Cadastro</button>
    </form>
</div>

<script>
    const checkboxes = document.querySelectorAll('.cb-vinculo');
    const caixaObservacao = document.getElementById('caixa-observacao');
    const labelObservacao = document.getElementById('label-observacao');
    const inputObservacao = document.getElementById('observacao');

    const textosObservacao = {
        'Aluno': 'Turma e turno:',
        'Pai/Mãe': 'Por quem é responsável:',
        'Responsavel': 'Responsável por:',
        'Autoridade': 'Qual autoridade ela é:'
    };

    checkboxes.forEach(checkbox => {
        checkbox.addEventListener('change', function() {
            if (this.checked) {
                // Desmarca todas as outras checkboxes
                checkboxes.forEach(cb => {
                    if (cb !== this) cb.checked = false;
                });

                // Mostra e configura a caixa de observação
                caixaObservacao.style.display = 'block';
                labelObservacao.textContent = textosObservacao[this.value];
                inputObservacao.placeholder = `Preencha com: ${textosObservacao[this.value]}`;
                inputObservacao.required = true;
                
            } else {
                // Se desmarcar, esconde a caixa
                caixaObservacao.style.display = 'none';
                inputObservacao.required = false;
                inputObservacao.value = '';
                inputObservacao.placeholder = '';
            }
        });
    });
</script>

</body>
</html>
